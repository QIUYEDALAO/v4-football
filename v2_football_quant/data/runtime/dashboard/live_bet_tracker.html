<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V4 实盘记录</title>
<style>
:root{--bg:#0b1220;--card:#121c31;--line:#24324d;--txt:#eaf1ff;--muted:#93a5bf;--good:#4dd18b;--bad:#ff6b72;--warn:#f3c969}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px;max-width:860px;margin-inline:auto}
h1{font-size:22px;margin:0 0 8px}.sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .k{font-size:11px;color:var(--muted)}.kpi .v{font-size:18px;font-weight:700;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}input,select,textarea,button{width:100%;border-radius:10px;border:1px solid #2a3b5d;background:#0e1728;color:#f0f6ff;padding:10px;font-size:16px}
button{background:#1e5eff;border-color:#2e6aff;font-weight:700}button.secondary{background:#29384f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;background:#0d1729}.item.pending{border-color:#f3c969}
.bad{color:var(--bad)}.good{color:var(--good)}.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:999px;background:#2d3d5a;margin-right:6px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>V4 实盘记录（本地）</h1>
<div class="sub">仅本地记录，不自动下注，不连接任何账号。</div>

<div class="grid" id="kpis"></div>

<div class="panel">
  <h3>快速添加投注</h3>
  <div class="row3">
    <div><label>日期</label><input id="f_date" /></div>
    <div><label>Fixture ID</label><input id="f_fixture" placeholder="可留空" /></div>
    <div><label>联赛</label><input id="f_league" /></div>
  </div>
  <div class="row">
    <div><label>主队中文</label><input id="f_home_cn" /></div>
    <div><label>客队中文</label><input id="f_away_cn" /></div>
  </div>
  <div class="row3">
    <div><label>评级</label><select id="f_grade"><option>A</option><option selected>B</option><option>C</option><option>SKIP</option></select></div>
    <div><label>盘口线</label><select id="f_line"><option>O0.75</option><option selected>O1</option><option>O1.25</option><option>O1.5</option></select></div>
    <div><label>建议 stake（可改）</label><input id="f_stake" type="number" step="0.01" /></div>
  </div>
  <div class="row3">
    <div><label>水位</label><input id="f_odds" type="number" step="0.01" value="0.9" /></div>
    <div><label>入场分钟</label><input id="f_entry_min" type="number" /></div>
    <div><label>入场比分</label><input id="f_entry_score" placeholder="0-0" /></div>
  </div>
  <div class="row3">
    <div><label>来源</label><select id="f_source"><option>official_57</option><option>outside_57_observation</option><option selected>manual</option></select></div>
    <div><label>状态</label><select id="f_status"><option selected>BET</option><option>NO_BET</option><option>VOID</option></select></div>
    <div><label>剧本</label><input id="f_script" /></div>
  </div>
  <label>备注</label><textarea id="f_notes" rows="2"></textarea>
  <div class="row">
    <button onclick="addBet()">添加记录</button>
    <button class="secondary" onclick="refreshAll()">刷新</button>
  </div>
</div>

<div class="panel">
  <h3>今日投注列表（未结算置顶）</h3>
  <div id="list"></div>
</div>

<script>
const API='';
const today=()=>new Date().toISOString().slice(0,10).replaceAll('-','');
const fmt=(n)=>Number(n||0).toFixed(2);
const risk=(net)=> net<=-1500?['已触及止损','bad'] : net>=1500?['建议收手','warn'] : net>=900?['仅做A O0.75/O1','warn'] : net>=600?['保护模式','warn'] : ['正常','good'];

function defaultStake(g,l){
  const m={A:{'O0.75':300,'O1':250,'O1.25':150,'O1.5':0},B:{'O0.75':150,'O1':120,'O1.25':0,'O1.5':0}};
  return (m[g]&&m[g][l]!==undefined)?m[g][l]:0;
}

function bindDefaultStake(){
  const g=document.getElementById('f_grade').value;
  const l=document.getElementById('f_line').value;
  document.getElementById('f_stake').value=defaultStake(g,l);
}

async function jget(url){ const r=await fetch(url); return r.json(); }
async function jpost(url,payload){ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); return r.json(); }

async function refreshKpis(){
  const d=document.getElementById('f_date').value||today();
  const ds=await jget(`/api/live_bets/summary?date=${d}`);
  const cs=await jget('/api/live_bets/cumulative');
  const s=ds.summary||{}; const c=cs.summary||{};
  const rk=risk(Number(s.today_net_pnl||0));
  const cards=[
    ['当前本金',fmt(c.current_bankroll||30000)],
    ['初始本金','30000.00'],
    ['今日投注额',fmt(s.today_stake)],
    ['今日毛盈亏',fmt(s.today_gross_pnl)],
    ['今日返水',fmt(s.today_rebate)],
    ['今日净盈亏',fmt(s.today_net_pnl)],
    ['今日 ROI',(Number(s.today_roi||0)*100).toFixed(2)+'%'],
    ['累计净盈亏',fmt(c.cumulative_net_pnl)],
    ['累计 ROI',(Number(c.cumulative_roi||0)*100).toFixed(2)+'%'],
    ['今日风险状态',rk[0],rk[1]],
  ];
  document.getElementById('kpis').innerHTML=cards.map(x=>`<div class='kpi'><div class='k'>${x[0]}</div><div class='v ${x[2]||''}'>${x[1]}</div></div>`).join('');
}

async function refreshList(){
  const d=document.getElementById('f_date').value||today();
  const res=await jget(`/api/live_bets?date=${d}`);
  let rows=(res.records||[]);
  rows=rows.sort((a,b)=> (a.settlement_result==='PENDING'?-1:1) - (b.settlement_result==='PENDING'?-1:1));
  document.getElementById('list').innerHTML=rows.map(r=>{
    const cls=r.settlement_result==='PENDING'?'item pending':'item';
    const pnl=Number(r.net_pnl||0);
    return `<div class='${cls}'>
      <div><span class='tag'>${r.v4_grade}</span><span class='tag'>${r.market_line}</span><b>${r.home_cn||r.home_en||'-'} vs ${r.away_cn||r.away_en||'-'}</b></div>
      <div class='muted'>stake ${fmt(r.stake)} | 水位 ${fmt(r.odds_water)} | 状态 ${r.settlement_result}</div>
      <div class='${pnl>=0?'good':'bad'}'>net ${fmt(pnl)}</div>
      <div class='row3'>
        <input id='g_${r.bet_id}' type='number' placeholder='HT进球数' />
        <input id='o_${r.bet_id}' type='number' step='0.01' value='${r.odds_water||0}' />
        <button onclick="settleBet('${r.date}','${r.bet_id}','${r.market_line}',${r.stake||0})">一键结算</button>
      </div>
      <button class='secondary' onclick="voidBet('${r.date}','${r.bet_id}')">作废</button>
    </div>`;
  }).join('') || '<div class="muted">暂无记录</div>';
}

async function addBet(){
  const p={
    date:document.getElementById('f_date').value||today(),
    fixture_id:document.getElementById('f_fixture').value||null,
    league:document.getElementById('f_league').value,
    home_cn:document.getElementById('f_home_cn').value,
    away_cn:document.getElementById('f_away_cn').value,
    v4_grade:document.getElementById('f_grade').value,
    market_line:document.getElementById('f_line').value,
    stake:Number(document.getElementById('f_stake').value||0),
    odds_water:Number(document.getElementById('f_odds').value||0),
    entry_minute:Number(document.getElementById('f_entry_min').value||0),
    score_at_entry:document.getElementById('f_entry_score').value,
    official_source:document.getElementById('f_source').value,
    bet_status:document.getElementById('f_status').value,
    v4_script:document.getElementById('f_script').value,
    notes:document.getElementById('f_notes').value,
  };
  const r=await jpost('/api/live_bets/add',p);
  if(!r.ok){ alert('添加失败: '+(r.error||'unknown')); return; }
  await refreshAll();
}

async function settleBet(date,betId,line,stake){
  const goals=Number(document.getElementById('g_'+betId).value||0);
  const odds=Number(document.getElementById('o_'+betId).value||0);
  const r=await jpost('/api/live_bets/settle',{date:date,bet_id:betId,market_line:line,stake:Number(stake),odds_water:odds,ht_goal_count:goals,rebate_rate:0.025});
  if(!r.ok){ alert('结算失败: '+(r.error||'unknown')); return; }
  await refreshAll();
}

async function voidBet(date,betId){
  const r=await jpost('/api/live_bets/void',{date:date,bet_id:betId,reason:'manual_void'});
  if(!r.ok){ alert('作废失败'); return; }
  await refreshAll();
}

async function refreshAll(){ await refreshKpis(); await refreshList(); }

document.getElementById('f_date').value=today();
document.getElementById('f_grade').addEventListener('change',bindDefaultStake);
document.getElementById('f_line').addEventListener('change',bindDefaultStake);
bindDefaultStake();
refreshAll();
</script>
</body>
</html>
