<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>V4统一作战台</title>
<style>
:root{
  --bg:#050914;
  --bg2:#081222;
  --card:#0e1a2d;
  --card2:#111f35;
  --line:#263a59;
  --text:#eef6ff;
  --muted:#8fa5c4;
  --muted2:#617794;
  --green:#32d991;
  --blue:#5cc8ff;
  --yellow:#ffd166;
  --red:#ff5d73;
  --purple:#a78bfa;
  --orange:#ff9f43;
  --shadow:0 14px 38px rgba(0,0,0,.33);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(92,200,255,.18),transparent 26%),
    radial-gradient(circle at 88% 2%,rgba(167,139,250,.16),transparent 25%),
    linear-gradient(180deg,#081426,#050914 62%);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1240px;margin:0 auto;padding:10px 12px 92px}
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0 8px;margin-bottom:6px;
  background:linear-gradient(180deg,rgba(8,20,38,.95),rgba(8,20,38,.70));
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#06111f;font-weight:950;font-size:14px;box-shadow:0 0 20px rgba(92,200,255,.22);
}
.title{font-size:20px;font-weight:900;line-height:1.08}
.subtitle{font-size:10px;color:var(--muted);line-height:1.35}
.pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  border:1px solid rgba(143,165,196,.24);border-radius:999px;
  background:rgba(255,255,255,.045);padding:5px 8px;
  color:#dbe8fb;font-size:10px;white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);margin-right:4px}
.grid{display:grid;gap:8px}
.kpi-grid{grid-template-columns:repeat(6,1fr)}
.card{
  border:1px solid rgba(143,165,196,.18);
  background:linear-gradient(180deg,rgba(255,255,255,.058),rgba(255,255,255,.025));
  box-shadow:var(--shadow);border-radius:var(--radius);padding:10px 12px;overflow:hidden;
}
.kpi{min-height:74px;padding:8px 10px}
.label{font-size:10px;color:var(--muted);font-weight:600}
.kpi .value{font-size:19px;font-weight:950;margin:3px 0 1px;letter-spacing:-.4px}
.hint{font-size:9.5px;color:var(--muted);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.green{color:var(--green)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.red{color:var(--red)}.purple{color:var(--purple)}.orange{color:var(--orange)}
.primary-layout{grid-template-columns:1.25fr .75fr;margin-top:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
h2{font-size:14px;margin:0}
.btn{
  border:1px solid rgba(92,200,255,.30);
  background:rgba(92,200,255,.10);
  color:#ddf6ff;border-radius:10px;padding:6px 9px;font-size:11px;text-decoration:none;
}
.btn.ghost{border-color:rgba(143,165,196,.22);background:rgba(255,255,255,.045);color:#dfeaf9}
.btn.warn{border-color:rgba(255,209,102,.34);background:rgba(255,209,102,.12);color:#ffe3a0}

/* 候选卡片 + 内嵌投注 */
.candidate{
  border:1px solid rgba(143,165,196,.15);
  border-radius:14px;padding:9px 10px;background:rgba(255,255,255,.035);
  margin-bottom:6px;
}
.cand-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.match{font-size:14px;font-weight:900;line-height:1.25}
.meta{font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:10px;border-radius:999px;padding:2px 6px;background:rgba(255,255,255,.07);color:#dce8fb;white-space:nowrap}
.badge.a{background:rgba(50,217,145,.14);color:#89f5c4}
.badge.b{background:rgba(92,200,255,.15);color:#a9e6ff}
.badge.warn{background:rgba(255,209,102,.13);color:#ffe4a7}
.badge.red{background:rgba(255,93,115,.13);color:#ffbac4}

/* 候选内嵌投注输入行 */
.bet-inline{
  margin-top:6px;padding-top:6px;border-top:1px solid rgba(143,165,196,.10);
  display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;
}
.bet-inline .bi-field{display:flex;flex-direction:column;gap:1px}
.bet-inline .bi-field label{font-size:9px;color:var(--muted)}
.bet-inline .bi-field input,
.bet-inline .bi-field select{
  width:100%;border:1px solid rgba(143,165,196,.20);border-radius:8px;
  background:rgba(0,0,0,.18);color:var(--text);padding:5px 6px;font-size:12px;outline:none;
}
.bet-inline .bi-field select{padding:4px 4px}
.bet-inline .bi-line{width:58px}
.bet-inline .bi-odds{width:52px}
.bet-inline .bi-stake{width:58px}
.bet-inline .bi-minute{width:50px}
.bet-inline .bi-actions{display:flex;gap:4px}

.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

/* 待办紧凑行 */
.todo-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;
}
.todo-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid rgba(143,165,196,.16);
}
.todo-chip .td{width:6px;height:6px;border-radius:50%}
.todo-chip .td.warn{background:var(--yellow)}
.todo-chip .td.ok{background:var(--green)}
.todo-chip .td.bad{background:var(--red)}

/* 实盘紧凑 2x3 网格 */
.snap-compact{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 8px;
}
.snap-compact .sc-item{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px;border-bottom:1px solid rgba(143,165,196,.08)}
.snap-compact .sc-item:last-child{border-bottom:0}
.snap-compact .sc-l{color:var(--muted)}
.snap-compact .sc-v{font-weight:800;font-variant-numeric:tabular-nums}

/* 底部工具条（替代四大模块卡） */
.toolbar{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;
  padding:8px 12px;
  border:1px solid rgba(143,165,196,.13);border-radius:14px;
  background:rgba(255,255,255,.025);
}
.toolbar span{font-size:10px;color:var(--muted);padding:4px 0}
.toolbar button{
  border:0;background:rgba(255,255,255,.045);color:var(--muted);border-radius:10px;
  padding:6px 10px;font-size:11px;
}
.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.07)}

.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stat{border:1px solid rgba(143,165,196,.13);border-radius:12px;padding:7px 9px;background:rgba(255,255,255,.04)}
.stat b{display:block;font-size:15px;margin-top:3px}

.note{
  border:1px solid rgba(255,209,102,.28);background:rgba(255,209,102,.10);
  color:#ffe7b2;border-radius:14px;padding:10px;font-size:12px;line-height:1.55;
}
.lock{
  border:1px solid rgba(255,93,115,.28);background:rgba(255,93,115,.085);
  color:#ffc2cb;border-radius:14px;padding:10px;font-size:12px;line-height:1.55;
}
details{
  border:1px solid rgba(143,165,196,.13);border-radius:14px;background:rgba(255,255,255,.035);
  padding:9px;margin-top:8px;
}
summary{cursor:pointer;font-weight:800;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
td,th{padding:8px;border-bottom:1px solid rgba(143,165,196,.12);text-align:left}
th{color:var(--muted);font-weight:650}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:rgba(6,11,20,.88);backdrop-filter:blur(16px);
  border-top:1px solid rgba(143,165,196,.18);
  padding:6px max(8px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));
}
.nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:780px;margin:0 auto}
.nav button{
  border:0;background:transparent;color:var(--muted);border-radius:12px;
  padding:6px 3px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;
}
.nav button b{font-size:15px;line-height:1}
.nav button.active{background:rgba(92,200,255,.12);border:1px solid rgba(92,200,255,.20);color:#e4f8ff}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);display:none;z-index:140}
.drawer.open{display:block}
.panel{
  position:absolute;right:0;top:0;bottom:0;width:min(650px,100%);
  background:#091321;border-left:1px solid rgba(143,165,196,.18);
  padding:16px;overflow:auto;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-head h3{margin:0;font-size:18px}
.close{border:0;background:rgba(255,255,255,.08);color:var(--text);border-radius:12px;padding:8px 10px}
.toast{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
  background:#101f34;border:1px solid rgba(92,200,255,.30);
  border-radius:999px;padding:10px 14px;font-size:12px;display:none;z-index:160;box-shadow:var(--shadow);
}
.toast.show{display:block}

/* 桌面端隐藏底部导航，释放首屏空间 */
@media(min-width:901px){
  .nav{display:none}
  .app{padding-bottom:24px}
  .toast{bottom:24px}
}

@media(max-width:980px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .primary-layout{grid-template-columns:1fr}
  .summary-grid{grid-template-columns:repeat(3,1fr)}
  .snap-compact{grid-template-columns:1fr 1fr}
  .bet-inline .bi-line{width:52px}
  .bet-inline .bi-odds{width:48px}
  .bet-inline .bi-stake{width:52px}
  .bet-inline .bi-minute{width:46px}
}
@media(max-width:540px){
  .app{padding:8px 8px 80px}
  .topbar{display:block}
  .pills{justify-content:flex-start;margin-top:6px}
  .title{font-size:18px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .card{border-radius:14px;padding:8px 10px}
  .kpi{min-height:66px}
  .kpi .value{font-size:17px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .candidate{border-radius:12px;padding:8px}
  .match{font-size:13px}
  .bet-inline{flex-direction:column;align-items:stretch}
  .bet-inline .bi-field{width:100% !important}
  .bet-inline .bi-actions{width:100%}
  .snap-compact{grid-template-columns:1fr 1fr}
  .toolbar{flex-direction:column;gap:4px}
  .nav{display:block}
  .app{padding-bottom:80px}
  .toast{bottom:74px}
  @media(min-width:901px){.nav{display:none}.app{padding-bottom:24px}.toast{bottom:24px}}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">V4</div>
      <div>
        <div class="title">V4统一作战台</div>
        <div class="subtitle">实时作战 · 候选驱动 · 实盘记录</div>
      </div>
    </div>
    <div class="pills">
      <span class="pill"><span class="dot"></span>运行中</span>
      <span class="pill">8766</span>
      <span class="pill">8765入口</span>
    </div>
  </header>

  <!-- 顶部 KPI — 紧凑一行 -->
  <section class="grid kpi-grid" aria-label="全局状态">
    <div class="card kpi">
      <div class="label">今日候选</div><div class="value blue" id="kpiCandidates">--</div><div class="hint" id="kpiCandidatesHint">A / B 正式候选</div>
    </div>
    <div class="card kpi">
      <div class="label">昨日验证</div><div class="value green" id="kpiYesterday">--</div><div class="hint" id="kpiYesterdayHint">A+B 已结算</div>
    </div>
    <div class="card kpi">
      <div class="label">验证累计</div><div class="value green" id="kpiCumulative">--</div><div class="hint" id="kpiCumulativeHint">A/B-only</div>
    </div>
    <div class="card kpi">
      <div class="label">今日盈亏</div><div class="value" id="kpiPnl">--</div><div class="hint" id="kpiPnlHint">净盈亏</div>
    </div>
    <div class="card kpi">
      <div class="label">流水 / 返水</div><div class="value purple" id="kpiTurnover">--</div><div class="hint" id="kpiTurnoverHint">当日累计</div>
    </div>
    <div class="card kpi">
      <div class="label">今日待办</div><div class="value yellow" id="kpiTodo">--</div><div class="hint" id="kpiTodoHint">待投注 · 待结算 · 待补验</div>
    </div>
  </section>

  <!-- 主区两栏 -->
  <main class="grid primary-layout">
    <!-- 左栏：候选 + 内嵌投注 -->
    <section class="card">
      <div class="section-head">
        <h2>今日候选行动区</h2>
        <button class="btn ghost" onclick="openPanel('intel')">情报详情</button>
      </div>
      <div id="candidateList"><p style="color:var(--muted);font-size:12px;text-align:center;padding:12px">加载中...</p></div>
    </section>

    <!-- 右栏：待办 + 实盘快照 -->
    <aside class="card">
      <div class="section-head">
        <h2>今日待办</h2>
        <button class="btn ghost" onclick="openPanel('rules')">操作规则</button>
      </div>
      <div class="todo-row" id="todoRow">
        <span class="todo-chip"><span class="td warn" id="dotBet"></span> 待投注 <b id="todoBetVal">--</b></span>
        <span class="todo-chip"><span class="td warn" id="dotSettle"></span> 待结算 <b id="todoSettleVal">--</b></span>
        <span class="todo-chip"><span class="td ok" id="dotVerify"></span> 待补验 <b id="todoVerifyVal">--</b></span>
        <span class="todo-chip"><span class="td ok" id="dotAlert"></span> 异常 <b id="todoAlertVal">0</b></span>
      </div>
      <div class="section-head" style="margin-top:6px"><h2>实盘快照</h2></div>
      <div class="snap-compact">
        <div class="sc-item"><span class="sc-l">投注本金</span><span class="sc-v" id="snapStake">--</span></div>
        <div class="sc-item"><span class="sc-l">投注盈亏</span><span class="sc-v" id="snapPnl">--</span></div>
        <div class="sc-item"><span class="sc-l">有效流水</span><span class="sc-v" id="snapTurnover">--</span></div>
        <div class="sc-item"><span class="sc-l">返水</span><span class="sc-v" id="snapRebate">--</span></div>
        <div class="sc-item"><span class="sc-l">净盈亏</span><span class="sc-v" id="snapNetPnl">--</span></div>
      </div>
      <div class="actions" style="margin-top:6px">
        <button class="btn warn" onclick="openPanel('settle')">结算投注</button>
        <a href="/live_bet_tracker.html" class="btn ghost">实盘记录</a>
      </div>
    </aside>
  </main>

  <!-- 底部工具条（替代四大模块卡） -->
  <div class="toolbar">
    <button onclick="openPanel('validation')">验证明细</button>
    <button onclick="openPanel('betapi')">接口详情</button>
    <button onclick="openPanel('review')">复盘与联赛</button>
    <button onclick="openPanel('system')">系统控制</button>
    <button onclick="openPanel('sources')">数据源锁</button>
    <span style="margin-left:auto;color:var(--green)">定时任务正常</span>
  </div>
</div>

<!-- 底部导航 — 仅手机端 -->
<nav class="nav">
  <div class="nav-inner">
    <button class="active" onclick="window.scrollTo(0,0)"><b>&#8962;</b>总览</button>
    <button onclick="openPanel('bet')"><b>+</b>投注</button>
    <button onclick="openPanel('validation')"><b>&#10003;</b>验证</button>
    <button onclick="openPanel('review')"><b>&#9678;</b>复盘</button>
    <button onclick="openPanel('system')"><b>&#9881;</b>系统</button>
  </div>
</nav>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="panel-head"><h3 id="panelTitle">详情</h3><button class="close" onclick="closePanel()">关闭</button></div>
    <div id="panelBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== 抽屉面板内容 ======
var PANELS = {
  intel: ["情报详情", "<div class='note'>读取候选视图 / 简报 / 球探。这里只做详情，不重复显示顶部验证累计。</div>"],
  rules: ["操作规则", "<table><tr><th>级别</th><th>允许内容</th></tr><tr><td>绿色</td><td>刷新只读模型、导出</td></tr><tr><td>黄色</td><td>补验待处理、重建汇总、运行守卫检查，必须二次确认</td></tr><tr><td>红色</td><td>完整扫描、改策略、改候选、云发布、改定时任务，不给按钮</td></tr></table>"],
  validation: ["验证明细", "<div id='panelValidationDetail'><p style='color:var(--muted)'>加载中...</p></div>"],
  betapi: ["接口详情", "<table><tr><th>接口</th><th>风险</th></tr><tr><td>新增投注</td><td>写记录+汇总+审计</td></tr><tr><td>修改投注</td><td>修改需审计</td></tr><tr><td>结算投注</td><td>结算不可逆</td></tr><tr><td>作废投注</td><td>作废需理由</td></tr></table>"],
  bet: ["新增投注（手动）", "<form id='betPanelForm' onsubmit='submitBetPanel(event)'><div class='field' style='margin-bottom:6px'><label>日期</label><input type='text' id='betDate' readonly></div><div class='field' style='margin-bottom:6px'><label>评级</label><input type='text' id='betGrade' readonly></div><div class='field' style='margin-bottom:6px'><label>球队</label><input type='text' id='betTeams' readonly placeholder='从候选卡片自动带入'></div><div class='field' style='margin-bottom:6px'><label>联赛</label><input type='text' id='betLeague' readonly></div><div class='field' style='margin-bottom:6px'><label>比赛编号</label><input type='text' id='betFixtureId' readonly></div><div class='field' style='margin-bottom:6px'><label>盘口线 *</label><select id='betLine' required><option value=''>请选择</option><option value='O0.75'>O0.75</option><option value='O1'>O1</option><option value='O1.25'>O1.25</option><option value='O1.5'>O1.5</option><option value='O2'>O2</option></select></div><div class='field' style='margin-bottom:6px'><label>水位 *</label><input type='number' id='betOdds' step='0.01' min='0.5' max='2.5' placeholder='如 0.85' required></div><div class='field' style='margin-bottom:6px'><label>金额 *</label><input type='number' id='betStake' step='1' min='1' placeholder='如 300' required></div><div class='field' style='margin-bottom:6px'><label>入场分钟</label><input type='text' id='betEntryMinute' placeholder='如 中场休息'></div><div class='field' style='margin-bottom:6px'><label>返水比例</label><input type='number' id='betRebateRate' step='0.001' value='0.025' min='0' max='0.05'></div><div class='field' style='margin-bottom:6px'><label>备注</label><textarea id='betNotes' rows='2' placeholder='选填'></textarea></div><div class='actions'><button type='submit' class='btn'>确认投注</button><button type='button' class='btn ghost' onclick='closePanel()'>取消</button></div></form>"],

function openPanel(key){
  var p = PANELS[key] || ["详情","暂无"];
  document.getElementById("panelTitle").textContent = p[0];
  document.getElementById("panelBody").innerHTML = p[1];
  document.getElementById("drawer").classList.add("open");
  if (key === 'validation' && MODEL) fillPanelValidation();
}
function closePanel(){ document.getElementById("drawer").classList.remove("open"); }
function fillPanelValidation(){
  var ts = MODEL.top_status;
  var yd = MODEL.yesterday_validation_detail;
  var h = '<table>';
  h += '<tr><th>项目</th><th>值</th></tr>';
  h += '<tr><td>昨日 A</td><td>'+esc(ts.yesterday_validation.A)+'</td></tr>';
  h += '<tr><td>昨日 B</td><td>'+esc(ts.yesterday_validation.B)+'</td></tr>';
  h += '<tr><td>昨日 A+B</td><td>'+esc(ts.yesterday_validation.AB)+'</td></tr>';
  h += '<tr><td>推荐/已验证/待补验</td><td>A'+esc(yd.recommended.A)+'/B'+esc(yd.recommended.B)+' 验'+esc(yd.verified.AB)+' 待'+esc(yd.pending.AB)+'</td></tr>';
  h += '<tr><td>累计 A</td><td>'+esc(ts.cumulative_validation.A)+'</td></tr>';
  h += '<tr><td>累计 B</td><td>'+esc(ts.cumulative_validation.B)+'</td></tr>';
  h += '<tr><td>累计 A+B</td><td>'+esc(ts.cumulative_validation.AB)+'</td></tr>';
  h += '</table>';
  document.getElementById("panelValidationDetail").innerHTML = h;
}

// ====== 数据绑定 ======
var MODEL = null;
const first=(...args)=>{for(let a of args)if(a!==void 0&&a!==null&&a!=="")return a;return args[args.length-1]};
const safe=(v,f="N/A")=>v===void 0||v===null||v===""?f:String(v).replace(/undefined/gi,f);
const arr=v=>(Array.isArray(v)?v:[]);
const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n.toFixed(d<1?0:d):String(d)};
const srcGroupDisplay=x=>{const sg=first(x.source_group,"");if(sg==="WHITELIST_57")return"57白名单";if(sg==="OUTSIDE_57")return"名单外";return"来源未标记";};
const uniDisplay=x=>{const u=first(x.fixture_universe,"");if(u==="all_eligible")return"全量合规";if(u==="whitelist")return"白名单";return u||"";};

var TODAY = new Date().toISOString().slice(0,10).replace(/-/g,'');

async function loadModel() {
  try {
    var resp = await fetch('/api/v4_control_center_model');
    if (resp.ok) {
      var data = await resp.json();
      if (data.ok && data.model) { MODEL = data.model; }
      else if (data.top_status || data.candidates) { MODEL = data; }
    }
  } catch(e) {}
  if (!MODEL) {
    try {
      var resp2 = await fetch('/v4_control_center_model.json');
      if (resp2.ok) { var data2 = await resp2.json(); MODEL = data2.model || data2; }
    } catch(e2) {}
  }
  if (MODEL) { MODEL = normalizeModel(MODEL); renderAll(); }
}

function renderAll() {
  renderTopBar();
  renderCandidates();
  renderValidationDetail();
  renderTodoAndSnapshot();
}

function normalizeModel(m){
  // Provide compatibility aliases for gold template field names
  if(!m.top_status) m.top_status = {};
  var ts = m.top_status;
  if(!ts.yesterday_validation) ts.yesterday_validation = {};
  if(!ts.yesterday_validation.display && m.top_status){
    var yv = ts.yesterday_validation;
    yv.display = first(ts.yesterday_validation_text, ts.yesterday_ab_text, "N/A");
    yv.A = first(ts.yesterday_a_text, "N/A");
    yv.B = first(ts.yesterday_b_text, "N/A");
    yv.AB = first(ts.yesterday_ab_text, "N/A");
  }
  if(!ts.cumulative_validation) ts.cumulative_validation = {};
  if(!ts.cumulative_validation.display && m.top_status){
    var cv = ts.cumulative_validation;
    cv.display = first(ts.cumulative_validation_text, ts.cumulative_ab_text, "N/A");
    cv.A = first(ts.cumulative_a_text, "N/A");
    cv.B = first(ts.cumulative_b_text, "N/A");
    cv.AB = first(ts.cumulative_ab_text, "N/A");
  }
  if(!ts.today_candidates_text) ts.today_candidates_text = first(ts.today_candidates_text, "A"+first(ts.today_a_count,0)+" / B"+first(ts.today_b_count,0)+" / SKIP"+first(ts.today_skip_count,0));
  // live_bet compatibility
  if(!m.live_bet) m.live_bet = m.live_bet_summary || {};
  if(!m.live_bet.today) m.live_bet.today = m.live_bet_summary || {};
  // yesterday_validation_detail compatibility
  if(!m.yesterday_validation_detail) m.yesterday_validation_detail = {recommended:{A:0,B:0},verified:{AB:0},pending:{AB:0}};
  if(!m.system) m.system = m.system_status || {};
  return m;
}
function renderTopBar() {
  var ts = MODEL.top_status;
  setText('kpiCandidates', ts.today_candidates.display);
  setText('kpiYesterday', ts.yesterday_validation.display);
  setText('kpiCumulative', ts.cumulative_validation.display);
  setText('kpiPnl', ts.today_pnl.display);
  setText('kpiTurnover', ts.turnover_and_rebate.display);
  setText('kpiTodo', ts.today_todo.display);
  var pnl = ts.today_pnl.net_pnl;
  var el = document.getElementById('kpiPnl');
  el.classList.remove('green','red');
  if (pnl > 0) el.classList.add('green');
  else if (pnl < 0) el.classList.add('red');
  setText('kpiCandidatesHint', 'A'+MODEL.candidates.a_count+'/B'+MODEL.candidates.b_count+'/SKIP'+MODEL.candidates.skip_count);
  setText('kpiYesterdayHint', 'A'+ts.yesterday_validation.A+' · B'+ts.yesterday_validation.B);
  setText('kpiCumulativeHint', ts.cumulative_validation.AB);
  setText('kpiTodoHint', '投'+ts.today_todo.pending_bet+' · 结'+ts.today_todo.pending_settle+' · 验'+ts.today_todo.pending_validation);
}

function renderCandidates() {
  var cand = MODEL.candidates;
  var aList = cand.a_candidates || [];
  var bList = cand.b_candidates || [];
  var skipList = cand.skip_candidates || [];
  var html = '';
  if (aList.length === 0 && bList.length === 0) {
    html = '<p style="color:var(--muted);font-size:12px;text-align:center;padding:12px">暂无今日候选，等待情报刷新</p>';
  } else {
    for (var i = 0; i < aList.length; i++) { html += buildCandidateCard(aList[i], 'A', i); }
    for (var i = 0; i < bList.length; i++) { html += buildCandidateCard(bList[i], 'B', i); }
  }
  if (skipList.length > 0) {
    var names = [];
    for (var i = 0; i < skipList.length; i++) {
      names.push(esc(skipList[i].home_cn || '?') + ' vs ' + esc(skipList[i].away_cn || '?'));
    }
    html += '<div style="border:1px solid rgba(143,165,196,.13);border-radius:12px;padding:6px 10px;margin-top:4px;font-size:10px;color:var(--muted);background:rgba(255,255,255,.025)">跳过：<b style="color:var(--yellow)">' + names.join('、') + '</b>（不投注）</div>';
  }
  document.getElementById('candidateList').innerHTML = html;
}

function buildCandidateCard(c, grade, idx) {
  var cls = grade === 'A' ? 'a' : 'b';
  var uid = 'c' + grade + idx;
  var h = '<article class="candidate">';
  h += '<div class="cand-top"><div>';
  h += '<div class="match">' + esc(c.home_cn || '?') + ' vs ' + esc(c.away_cn || '?') + '</div>';
  var sgLabel = srcGroupDisplay(c);
  var uniLabel = uniDisplay(c);
  h += '<div class="meta">' + esc(c.league || '') + ' · ' + grade + '级 · ' + esc(c.kickoff_time || '开赛时间待定');
  h += ' · ' + (c.script_type ? esc(c.script_type) : '正式候选');
  h += '</div></div>';
  h += '<span class="badge ' + cls + '">' + grade + '</span></div>';
  h += '<div class="tags" style="margin-top:4px"><span class="tag">正式候选</span><span class="tag warn">' + sgLabel + '</span><span class="tag">' + uniLabel + '</span></div>';
  // 内嵌投注输入行
  var defOdds = first(c.default_odds, null);
  var defStake = first(c.default_stake, null);
  var defMin = first(c.default_entry_minute, null);
  h += '<div class="bet-inline">';
  h += '<div class="bi-field bi-line"><label>盘口</label><select id="' + uid + '_line"><option value="O0.75">O0.75</option><option value="O1" selected>O1</option><option value="O1.25">O1.25</option><option value="O1.5">O1.5</option><option value="O2">O2</option></select></div>';
  h += '<div class="bi-field bi-odds"><label>水位</label><input type="number" id="' + uid + '_odds" step="0.01" value="' + (defOdds||"") + '" min="0.5" max="2.5" placeholder="0.86"></div>';
  h += '<div class="bi-field bi-stake"><label>金额</label><input type="number" id="' + uid + '_stake" step="1" value="' + (defStake||"") + '" min="1" placeholder="金额"></div>';
  h += '<div class="bi-field bi-minute"><label>分钟</label><input type="text" id="' + uid + '_min" value="' + (defMin||"") + '" placeholder="分钟"></div>';
  h += '<div class="bi-actions">';
  h += '<button class="btn" onclick="inlineBet(\'' + uid + '\',' + JSON.stringify(c).replace(/'/g,"\\'") + ')">记录投注</button>';
  h += '<button class="btn ghost" onclick="openPanel(\'intel\')">情报</button>';
  h += '</div></div>';
  h += '</article>';
  return h;
}

function renderValidationDetail() {
  var ts = MODEL.top_status;
  setText('vdYA', ts.yesterday_validation.A);
  setText('vdYB', ts.yesterday_validation.B);
  setText('vdYAB', ts.yesterday_validation.AB);
  setText('vdYSum', 'A'+MODEL.yesterday_validation_detail.recommended.A+'/B'+MODEL.yesterday_validation_detail.recommended.B+' 验'+MODEL.yesterday_validation_detail.verified.AB+' 待'+MODEL.yesterday_validation_detail.pending.AB);
  setText('vdCA', ts.cumulative_validation.A);
  setText('vdCB', ts.cumulative_validation.B);
  setText('vdCAB', ts.cumulative_validation.AB);
}

function renderTodoAndSnapshot() {
  var ts = MODEL.top_status;
  var lb = MODEL.live_bet.today;
  var cum = MODEL.live_bet.cumulative;
  var todoBet = MODEL.candidates.a_count + MODEL.candidates.b_count;
  var todoSettle = Math.max(0, lb.effective_bet_records - lb.settled_records);
  var todoVerify = ts.today_todo.pending_validation || 0;
  var todoAlert = ts.today_todo.system_alerts || 0;

  setText('todoBetVal', todoBet);
  setText('todoSettleVal', todoSettle);
  setText('todoVerifyVal', todoVerify);
  setText('todoAlertVal', todoAlert);

  document.getElementById('dotBet').className = 'td ' + (todoBet > 0 ? 'warn' : 'ok');
  document.getElementById('dotSettle').className = 'td ' + (todoSettle > 0 ? 'warn' : 'ok');
  document.getElementById('dotVerify').className = 'td ' + (todoVerify > 0 ? 'warn' : 'ok');
  document.getElementById('dotAlert').className = 'td ' + (todoAlert > 0 ? 'bad' : 'ok');

  setText('snapStake', fmt(lb.stake_amount));
  setText('snapTurnover', fmt(lb.effective_turnover));
  setText('snapRebate', fmt4(lb.rebate));

  var pEl = document.getElementById('snapPnl');
  var pv = lb.gross_pnl || 0;
  pEl.textContent = (pv >= 0 ? '+' : '') + pv.toFixed(2);
  pEl.style.color = pv >= 0 ? 'var(--green)' : 'var(--red)';

  var nEl = document.getElementById('snapNetPnl');
  var nv = lb.net_pnl || 0;
  nEl.textContent = (nv >= 0 ? '+' : '') + nv.toFixed(2);
  nEl.style.color = nv >= 0 ? 'var(--green)' : 'var(--red)';
}

function setText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = (val != null && val !== '' ? String(val) : '0');
}
function fmt(v) { return (v != null ? Number(v).toFixed(2) : '0.00'); }
function fmt4(v) { return (v != null ? Number(v).toFixed(4) : '0.0000'); }

// ====== 内嵌投注提交 ======
function inlineBet(uid, card) {
  var line = document.getElementById(uid + '_line').value;
  var odds = parseFloat(document.getElementById(uid + '_odds').value);
  var stake = parseFloat(document.getElementById(uid + '_stake').value);
  var minute = document.getElementById(uid + '_min').value;
  if (!line || isNaN(odds) || isNaN(stake)) { showToast('请填写盘口、水位、金额'); return; }
  var payload = {
    date: TODAY,
    grade: card._grade || card.grade || '',
    league: card.league || '',
    home_cn: card.home_cn || '?',
    away_cn: card.away_cn || '?',
    fixture_id: card.fixture_id || '',
    market_line: line,
    odds_water: odds,
    stake: stake,
    entry_minute: minute || '',
    rebate_rate: 0.025,
    notes: '',
    bet_status: 'BET', settlement_result: 'PENDING',
  };
  fetch('/api/live_bets/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.ok) { showToast('投注记录成功'); refreshModel(); }
      else { showToast('失败：' + (d.error || '未知错误')); }
    })
    .catch(function(e){ showToast('网络错误：' + e.message); });
}

// ====== 抽屉投注 / 结算 ======
async function submitBetPanel(e) {
  e.preventDefault();
  var teams = (document.getElementById('betTeams').value || '? vs ?').split(' vs ');
  var payload = {
    date: document.getElementById('betDate').value,
    grade: document.getElementById('betGrade').value || 'MANUAL',
    league: document.getElementById('betLeague').value || '',
    home_cn: teams[0].trim(), away_cn: teams.length > 1 ? teams[1].trim() : '',
    fixture_id: document.getElementById('betFixtureId').value || '',
    market_line: document.getElementById('betLine').value,
    odds_water: parseFloat(document.getElementById('betOdds').value),
    stake: parseFloat(document.getElementById('betStake').value),
    entry_minute: document.getElementById('betEntryMinute').value || '',
    rebate_rate: parseFloat(document.getElementById('betRebateRate').value) || 0.025,
    notes: document.getElementById('betNotes').value || '',
    bet_status: 'BET', settlement_result: 'PENDING',
  };
  try {
    var resp = await fetch('/api/live_bets/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    var data = await resp.json();
    if (data.ok) { showToast('投注记录成功'); closePanel(); refreshModel(); }
    else { showToast('投注失败：' + (data.error || '未知错误')); }
  } catch(err) { showToast('网络错误：' + err.message); }
}

async function submitSettlePanel(e) {
  e.preventDefault();
  var date = document.getElementById('settleDate').value;
  var betId = document.getElementById('settleBetId').value;
  var htGoals = parseInt(document.getElementById('settleHtHome').value) + parseInt(document.getElementById('settleHtAway').value);
  try {
    var getResp = await fetch('/api/live_bets?date=' + date);
    var getData = await getResp.json();
    var records = getData.records || [];
    var rec = null;
    for (var i = 0; i < records.length; i++) { if (records[i].bet_id === betId) { rec = records[i]; break; } }
    if (!rec) { showToast('未找到投注记录：' + betId); return; }
    var settlePayload = {
      date: date, bet_id: betId, ht_goal_count: htGoals,
      stake: parseFloat(rec.stake), odds_water: parseFloat(rec.odds_water),
      market_line: rec.market_line, rebate_rate: parseFloat(rec.rebate_rate) || 0.025,
    };
    var resp = await fetch('/api/live_bets/settle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(settlePayload) });
    var data = await resp.json();
    if (data.ok) { showToast('结算成功'); closePanel(); refreshModel(); }
    else { showToast('结算失败：' + (data.error || '未知错误')); }
  } catch(err) { showToast('网络错误：' + err.message); }
}

async function refreshModel() {
  MODEL = null;
  try {
    var resp = await fetch('/api/v4_control_center_model');
    if (resp.ok) {
      var data = await resp.json();
      if (data.ok && data.model) { MODEL = data.model; }
      else if (data.top_status || data.candidates) { MODEL = data; }
    }
  } catch(e) {}
  if (MODEL) { MODEL = normalizeModel(MODEL); renderAll(); }
  else showToast('刷新失败，请检查服务状态');
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2200);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('drawer').addEventListener('click', function(e){
  if (e.target === document.getElementById('drawer')) closePanel();
});

loadModel();
</script>
