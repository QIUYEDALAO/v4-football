<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>V3 World Cup WC10 War Room</title>
<style>
body{margin:0;background:#0b1220;color:#e6edf7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:960px;margin:0 auto;padding:12px}
.card{background:#121c31;border:1px solid #2a3b5e;border-radius:12px;padding:10px;margin-bottom:10px}
.title{font-weight:900;font-size:20px}
.sub{font-size:12px;color:#9fb2d3;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:#0e1729;border:1px solid #243754;border-radius:10px;padding:8px}
.mini span{display:block;font-size:10px;color:#8ea4c7}
.mini b{display:block;font-size:14px;margin-top:3px}
.note{font-size:12px;line-height:1.5;color:#cad8ec}
.warn{color:#ffd166}
.list .mini{margin-bottom:7px}
@media (max-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="title">V3 World Cup T-10 War Room</div>
    <div class="sub">Observation-only, not betting recommendation</div>
  </div>
  <div id="root" class="card">Loading...</div>
</div>
<script>
function n(v,d){return v===undefined||v===null||v===''?d:v}
function a(v){return Array.isArray(v)?v:[]}
function item(x){return `<div class="mini"><span>${n(x.team,'UNKNOWN')} · ${n(x.signal_type,'WATCHLIST_ONLY')}</span><b>${n(x.confidence,'LOW')} · ${n(x.action_hint,'WATCHLIST_ONLY')}</b><span>${n(x.reason,'')}</span></div>`}
function teamItem(x){return `<div class="mini"><span>${n(x.team_name,'UNKNOWN')} · ${n(x.candidate_status,'UNKNOWN')}</span><b>${n(x.recommended_candidate_source,'N/A')} · ${x.safe_for_candidate_review?'safe':'hold'}</b><span>${n(x.hold_reason,'')}</span></div>`}
function pct(v){return ((Number(v||0))*100).toFixed(1)+'%'}
async function load(){
  const root=document.getElementById('root');
  try{
    const resp=await fetch('/data/v3_worldcup/war_room/v3_worldcup_wc10_war_room_20260602.json?ts='+Date.now());
    const m=await resp.json();
    const warn=a(m.warn_only_items);
    const supp=m.supplement_coverage_by_category||{};
    const suppRows=Object.keys(supp).map(k=>`<div class="mini"><span>${k}</span><b>${n((supp[k]||{}).coverage_status,'MISSING')}</b></div>`).join('');
    const fsMissing=a(m.final_squad_missing_team_list);
    const crs=m.candidate_review_summary||{};
    const crc=m.candidate_review_counts||{};
    const crFocus=a(m.candidate_review_focus_teams);
    const crSafe=a(m.candidate_review_safe_teams);
    const crHold=a(m.candidate_review_hold_teams);
    const hms=m.historical_market_baseline_summary||{};
    const hmc=m.historical_market_baseline_counts||{};
    const hmr=m.historical_market_baseline_key_rates||{};
    const hmq=m.historical_market_baseline_data_quality||{};
    const hmy=a(m.historical_market_baseline_years);
    const pgl=m.perception_gap_input_layers||{};
    const pgHist=pgl.historical_market_baseline||{};
    const pgMarket=pgl.current_match_market_layer||{};
    const pgLineup=pgl.lineup_formation_value_delta_layer||{};
    const pgTags=a(m.perception_gap_output_tags);
    const pgInputs=a(m.perception_gap_next_required_inputs);
    const pgGuard=m.perception_gap_safety_guard||{};
    const venueFocus=a(m.venue_stress_focus_venues);
    const venueRows=a(m.venue_stress_venues);
    const venueTags=a(m.venue_stress_tags_allowed);
    const matchPgSamples=a(m.match_level_perception_gap_dryrun_samples);
    const matchPgGuard=m.match_level_perception_gap_dryrun_safety_guard||{};
    const matchPgCases=m.match_level_perception_gap_dryrun_market_data_status_cases||{};
    const under=a(m.undervalued_candidates), over=a(m.overhyped_risk_candidates);
    root.innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="mini"><span>phase</span><b>${n(m.phase,'V3-WC10')}</b></div>
        <div class="mini"><span>T_minus_days</span><b>${n(m.T_minus_days,10)}</b></div>
        <div class="mini"><span>status</span><b>${n(m.status,'WARN_ONLY')}</b></div>
        <div class="mini"><span>teams</span><b>${n(m.teams_with_roster,0)} / ${n(m.teams_total,0)}</b></div>
        <div class="mini"><span>players_total</span><b>${n(m.players_total,0)}</b></div>
        <div class="mini"><span>warn_only</span><b>${warn.length}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="note">场馆压力 / Venue Stress Observation</div>
      <div class="grid">
        <div class="mini"><span>status</span><b>${n(m.venue_stress_status,'DATA_MISSING')}</b></div>
        <div class="mini"><span>venues</span><b>${n(m.venue_stress_count,0)} / 16</b></div>
        <div class="mini"><span>focus venues</span><b>${n(m.venue_stress_focus_count,0)} / 5</b></div>
        <div class="mini"><span>observation_only</span><b>${String(n((m.venue_stress_safety_guard||{}).observation_only,true))}</b></div>
        <div class="mini"><span>betting_recommendation</span><b>${String(n((m.venue_stress_safety_guard||{}).betting_recommendation,false))}</b></div>
        <div class="mini"><span>video claim scoring</span><b>${String(!n((m.venue_stress_safety_guard||{}).video_claim_not_scoring_input,true))}</b></div>
      </div>
      <div class="note">观察标签：${venueTags.join('、')||'HEAT_STRESS、HUMIDITY_STRESS、ALTITUDE_STRESS、MIDDAY_KICKOFF_RISK、VENUE_UPSET_WATCH、WATCH_ONLY'}</div>
      <div class="note warn">仅显示场馆压力、风险原因、数据来源等级；不作为胜负判断，不作为投注建议。</div>
      <div class="grid">
        ${(venueFocus.map(x=>`<div class="mini"><span>${n(x.venue,'UNKNOWN')} · ${n(x.city,'')}</span><b>${a(x.stress_tags).join(' / ')}</b><span>风险原因：${n(x.stress_reason,'')} · 数据来源等级：${n(x.source_quality,'UNKNOWN')} · video_claim_allowed=${String(n(x.video_claim_allowed,false))}</span></div>`).join('')||'<div class="note">暂无重点场馆</div>')}
      </div>
      <details><summary class="note">16 场馆完整列表 (${venueRows.length})</summary>${venueRows.map(x=>`<div class="mini"><span>${n(x.venue,'UNKNOWN')} · ${n(x.country,'')}</span><b>${a(x.stress_tags).join(' / ')}</b><span>altitude=${n(x.altitude,'N/A')}m · heat=${n(x.temperature_risk,'N/A')} · humidity=${n(x.humidity_risk,'N/A')} · midday=${n(x.midday_risk,'N/A')}</span></div>`).join('')}</details>
    </div>
    <div class="card">
      <div class="note">世界杯历史市场基准 / Historical Market Baseline</div>
      <div class="grid">
        <div class="mini"><span>baseline status</span><b>${n(m.historical_market_baseline_status,'DATA_MISSING')}</b></div>
        <div class="mini"><span>years</span><b>${hmy.map(x=>x.year).join(' / ')||'2014 / 2018 / 2022'}</b></div>
        <div class="mini"><span>matches</span><b>${n(hms.total_world_cup_finals_matches,192)}</b></div>
        <div class="mini"><span>heavy favorite win</span><b>${pct(hmr.heavy_favorite_win_rate)}</b></div>
        <div class="mini"><span>strong favorite win</span><b>${pct(hmr.strong_favorite_win_rate)}</b></div>
        <div class="mini"><span>favorite failed</span><b>${pct(hmr.favorite_failed_rate)}</b></div>
        <div class="mini"><span>underdog upset</span><b>${n(hmc.underdog_upset_count,43)}</b></div>
        <div class="mini"><span>draw result</span><b>${n(hmc.draw_result_count,38)}</b></div>
        <div class="mini"><span>HT draw</span><b>${n(hmc.ht_draw_count,95)}</b></div>
        <div class="mini"><span>Over 2.5</span><b>${n(hmc.over_2_5_count,99)}</b></div>
        <div class="mini"><span>BTTS</span><b>${n(hmc.btts_count,96)}</b></div>
        <div class="mini"><span>data source</span><b>Excel + cache</b></div>
      </div>
      <div class="note">TheStatsAPI coverage: match=${n(hmq.thestatsapi_match_coverage,'128/192')} / odds 2018=${n((hmq.thestatsapi_odds_coverage||{})['2018'],'34/64')} / odds 2022=${n((hmq.thestatsapi_odds_coverage||{})['2022'],'33/64')} / lineups 2018=${n((hmq.thestatsapi_lineup_coverage||{})['2018'],'26/64')} / lineups 2022=${n((hmq.thestatsapi_lineup_coverage||{})['2022'],'22/64')}</div>
      <details><summary class="note">年度摘要</summary>${hmy.map(x=>`<div class="mini"><span>${x.year}</span><b>${x.matches} matches</b></div>`).join('')}</details>
      <div class="note warn">历史赔率只用于 Perception Gap 观察，不是投注建议。不是 V4 official grade，不影响 V4 A/B/C/SKIP。</div>
    </div>
    <div class="card">
      <div class="note">Perception Gap 评分蓝图</div>
      <div class="grid">
        <div class="mini"><span>blueprint status</span><b>${n(m.perception_gap_blueprint_status,'DATA_MISSING')}</b></div>
        <div class="mini"><span>observation_only</span><b>${String(n(pgGuard.observation_only,true))}</b></div>
        <div class="mini"><span>affects V4 grade</span><b>${String(n(pgGuard.affects_v4_grade,false))}</b></div>
      </div>
      <div class="note">历史市场基准层</div>
      <div class="grid">
        <div class="mini"><span>favorite_band</span><b>${n(pgHist.favorite_band,'schema')}</b></div>
        <div class="mini"><span>favorite failed</span><b>${pct(pgHist.historical_favorite_failed_rate)}</b></div>
        <div class="mini"><span>HT draw</span><b>${pct(pgHist.historical_ht_draw_rate)}</b></div>
        <div class="mini"><span>upset</span><b>${pct(pgHist.historical_upset_rate)}</b></div>
      </div>
      <div class="note">当前市场 / API prediction 层</div>
      <div class="grid">
        ${Object.keys(pgMarket).slice(0,11).map(k=>`<div class="mini"><span>${k}</span><b>${n(pgMarket[k],'schema')}</b></div>`).join('')}
      </div>
      <div class="note">首发 / 阵型 / 身价差值层</div>
      <div class="grid">
        ${Object.keys(pgLineup).slice(0,13).map(k=>`<div class="mini"><span>${k}</span><b>${n(pgLineup[k],'schema')}</b></div>`).join('')}
      </div>
      <div class="note">观察标签：${pgTags.join('、')||'UNDERVALUED_WATCH、OVERHYPED_RISK、MARKET_FAIR、LINEUP_WEAKENED、LINEUP_STRONGER_THAN_EXPECTED、DATA_INSUFFICIENT、WATCH_ONLY'}</div>
      <div class="note">下一步需要：${pgInputs.join('、')||'当前赔率、API prediction、赛前首发、阵型、首发身价'}</div>
      <div class="note warn">这是观察层，不是投注建议。不影响 V4 A/B/C/SKIP。不自动下注。首发层等赛前 30 分钟输入后才启用。</div>
    </div>
    <div class="card">
      <div class="note">WC4D Match-Level Perception Gap Dry Run</div>
      <div class="grid">
        <div class="mini"><span>status</span><b>${n(m.match_level_perception_gap_dryrun_status,'DATA_MISSING')}</b></div>
        <div class="mini"><span>samples</span><b>${n(m.match_level_perception_gap_dryrun_sample_count,0)} / 5</b></div>
        <div class="mini"><span>observation_only</span><b>${String(n(matchPgGuard.observation_only,true))}</b></div>
        <div class="mini"><span>betting_recommendation</span><b>${String(n(matchPgGuard.betting_recommendation,false))}</b></div>
        <div class="mini"><span>affects V4 grade</span><b>${String(n(matchPgGuard.affects_v4_grade,false))}</b></div>
        <div class="mini"><span>scoring changed</span><b>${String(n(matchPgGuard.scoring_changed,false))}</b></div>
      </div>
      <div class="note warn">只展示 match-level observation，不进入推荐，不影响 V4。</div>
      <div class="grid">
        ${(matchPgSamples.map(x=>`<div class="mini"><span>${n(x.sample_id,'WC4D')} · ${n(x.match,'UNKNOWN')}</span><b>${n(x.market_data_status,n(x.market_gap_tag,'DATA_INSUFFICIENT'))} · ${n(x.perception_gap_tag,'DATA_INSUFFICIENT;WATCH_ONLY')}</b><span>dry-run case=${n(x.market_upgrade_case,'N/A')} · odds=${String(n(x.dryrun_has_odds,false))} · xG=${String(n(x.dryrun_has_xg,false))} · prediction=${String(n(x.dryrun_has_api_prediction,false))}</span><span>real_market_cache_used=${String(n(x.real_market_cache_used,false))} · source=${n(x.market_data_status_source,'DRYRUN_SIMULATED_INPUT_NOT_REAL_CACHE')}</span><span>venue=${n(x.venue,'N/A')} · venue_stress=${n(x.venue_stress_tag,'WATCH_ONLY')} · squad=${n(x.squad_data_quality,'SQUAD_DATA_INSUFFICIENT')}</span><span>team_status=${n(x.home_candidate_status,'N/A')} / ${n(x.away_candidate_status,'N/A')}</span><span>data_gap=${n(x.data_insufficient_reason,'')}</span></div>`).join('')||'<div class="note">暂无 WC4D dry-run 样例</div>')}
      </div>
      <div class="note">market data path: ${a(m.match_level_perception_gap_dryrun_market_data_status_path).join(' -> ')||'CURRENT_MARKET_DATA_MISSING -> MARKET_DATA_PARTIAL -> MARKET_DATA_AVAILABLE'}</div>
      <div class="note">market data cases: missing=${n(matchPgCases.CURRENT_MARKET_DATA_MISSING,0)} / partial=${n(matchPgCases.MARKET_DATA_PARTIAL,0)} / available=${n(matchPgCases.MARKET_DATA_AVAILABLE,0)} · real_market_cache_used=${String(n(m.match_level_perception_gap_dryrun_real_market_cache_used,false))}</div>
      <div class="note">VENUE_UPSET_WATCH definition: ${n(m.match_level_perception_gap_dryrun_upset_watch_definition,'historical_data_insufficient_for_probability')}，不是冷门预测，不进入评分。</div>
    </div>
    <div class="card">
      <div class="note">世界杯名单候选审查 / Candidate Review</div>
      <div class="grid">
        <div class="mini"><span>source_status</span><b>${n(crs.source_status,n(m.candidate_review_status,'CANDIDATE_REVIEW_ONLY'))}</b></div>
        <div class="mini"><span>official_final_squad_written</span><b>${String(n(crs.official_final_squad_written,false))}</b></div>
        <div class="mini"><span>final_squad_complete</span><b>${String(n(crs.final_squad_complete,false))}</b></div>
        <div class="mini"><span>teams_total</span><b>${n(crs.teams_total,48)}</b></div>
        <div class="mini"><span>teams_safe</span><b>${n(crs.teams_safe,0)}</b></div>
        <div class="mini"><span>teams_hold</span><b>${n(crs.teams_hold,0)}</b></div>
        <div class="mini"><span>API teams / players</span><b>${n(crs.api_teams,0)} / ${n(crs.api_players,0)}</b></div>
        <div class="mini"><span>Wiki teams / players</span><b>${n(crs.wikipedia_teams,0)} / ${n(crs.wikipedia_players,0)}</b></div>
        <div class="mini"><span>official confirmed</span><b>${n(crs.official_confirmed,0)}</b></div>
      </div>
      <div class="note warn">primary blocker: ${n(crs.primary_blocker,'Turkey final 26 not found')}</div>
      <div class="grid">
        <div class="mini"><span>官方确认</span><b>${n(crc.OFFICIAL_CONFIRMED,0)}</b></div>
        <div class="mini"><span>API干净候选</span><b>${n(crc.API_CLEAN_CANDIDATE,0)}</b></div>
        <div class="mini"><span>API+Wiki一致</span><b>${n(crc.API_WIKI_ALIGNED_CANDIDATE,0)}</b></div>
        <div class="mini"><span>Wiki优先/API池过大</span><b>${n(crc.WIKI_PREFERRED_API_POOL_OVERFULL,0)}</b></div>
        <div class="mini"><span>API不完整</span><b>${n(crc.API_INCOMPLETE_NEED_REVIEW,0)}</b></div>
        <div class="mini"><span>临时大名单</span><b>${n(crc.PROVISIONAL_OVERFULL_NEED_REVIEW,0)}</b></div>
      </div>
      <div class="note">重点队</div>
      ${(crFocus.map(teamItem).join('')||'<div class="note">暂无</div>')}
      <details><summary class="note">safe list (${crSafe.length})</summary>${(crSafe.map(teamItem).join('')||'<div class="note">暂无</div>')}</details>
      <details><summary class="note">hold list (${crHold.length})</summary>${(crHold.map(teamItem).join('')||'<div class="note">暂无</div>')}</details>
      <div class="note warn">这是候选审查，不是 official final squad。API/Wikipedia 是候选或索引源，不是官方最终名单。当前不能声明 final squad complete。Turkey 仍需 TFF final 26。不输出投注建议。</div>
    </div>
    <div class="card">
      <div class="note">数据覆盖：roster=${n(m.roster_coverage_status,'MISSING')} / caps-goals-minutes=${n(m.caps_goals_minutes_coverage_status,'MISSING')} / injury=${n(m.injury_coverage_status,'MISSING')} / friendly=${n(m.friendly_form_coverage_status,'MISSING')} / market=${n(m.market_baseline_coverage_status,'MISSING')}</div>
      <div class="note warn">WARN_ONLY: ${warn.join('、')}</div>
      <div class="note">supplement layer: ${n(m.supplement_coverage_status,'DATA_MISSING')}（TEMPLATE_ONLY / MISSING 时不得下结论）</div>
      <div class="grid">${suppRows||'<div class="note">supplement coverage data missing</div>'}</div>
    </div>
    <div class="card">
      <div class="note">final squad layer: ${n(m.final_squad_status,'DATA_MISSING')} / coverage=${n(m.final_squad_coverage_status,'DATA_MISSING')}</div>
      <div class="grid">
        <div class="mini"><span>teams_expected</span><b>${n(m.teams_expected_final_squad,48)}</b></div>
        <div class="mini"><span>teams_detected_baseline</span><b>${n(m.teams_detected_in_baseline,46)}</b></div>
        <div class="mini"><span>players_total_baseline</span><b>${n(m.players_total_baseline,1375)}</b></div>
        <div class="mini"><span>final_squad_files_found</span><b>${n(m.final_squad_files_found_count,0)}</b></div>
        <div class="mini"><span>final_26_complete_teams</span><b>${n(m.final_26_complete_teams_count,0)}</b></div>
        <div class="mini"><span>missing_team_count</span><b>${n(m.final_squad_missing_team_count,0)}</b></div>
      </div>
      <div class="note">missing team list (sample): ${fsMissing.length?fsMissing.join('、'):'N/A'}</div>
      <div class="note warn">当前 1375 为 baseline pool，不是最终 26 人名单。当前系统尚未确认 48 队最终名单。</div>
    </div>
    <div class="card">
      <div class="note">source authorization gate: ${n(m.source_authorization_gate_status,'DATA_MISSING')}</div>
      <div class="grid">
        <div class="mini"><span>approved sources</span><b>${n(m.source_authorization_approved_sources_count,0)}</b></div>
        <div class="mini"><span>intake files found</span><b>${n(m.source_authorization_intake_files_found,0)}</b></div>
        <div class="mini"><span>unauthorized files</span><b>${n(m.source_authorization_unauthorized_files_found,0)}</b></div>
        <div class="mini"><span>authorized files</span><b>${n(m.source_authorization_authorized_files_found,0)}</b></div>
        <div class="mini"><span>ready for WC6 ingestion</span><b>${n(m.source_authorization_ready_for_ingestion,0)}</b></div>
      </div>
      <div class="note warn">未授权文件不得 ingest。当前没有 approved real final squad source。WC6 ingestion not started。</div>
    </div>
    <div class="card">
      <div class="note">WC6 authorized ingestion dry-run: ${n(m.wc6_ingestion_dryrun_status,'DATA_MISSING')}</div>
      <div class="grid">
        <div class="mini"><span>dryrun files parsed</span><b>${n(m.wc6_ingestion_dryrun_files_parsed,0)}</b></div>
        <div class="mini"><span>official final squad written</span><b>${String(n(m.wc6_ingestion_dryrun_official_written,false))}</b></div>
        <div class="mini"><span>dryrun only</span><b>${String(n(m.wc6_ingestion_dryrun_only,true))}</b></div>
      </div>
      <div class="note warn">当前未开始真实 final squad ingestion。无授权文件时自动 NOOP。dry-run 不等于 official final squad。</div>
    </div>
    <div class="card list">
      <div class="note">Perception Gap Watchlist（每类最多显示 5 条）</div>
      <div class="note">undervalued candidates</div>
      ${(under.slice(0,5).map(item).join('')||'<div class="note">暂无</div>')}
      ${under.length>5?`<div class="note">+${under.length-5} more</div>`:''}
      <div class="note">overhyped risk candidates</div>
      ${(over.slice(0,5).map(item).join('')||'<div class="note">暂无</div>')}
      ${over.length>5?`<div class="note">+${over.length-5} more</div>`:''}
    </div>
    <div class="card">
      <div class="note">开幕战关注：${n((m.opening_match_watch||{}).status,'WATCH_ONLY_PLACEHOLDER')} · ${(m.opening_match_watch||{}).note||''}</div>
      <div class="note">V3 仅为世界杯情报观察层；不输出投注建议；不影响 V4 official grade；缺少 supplement 时不下结论；任何 watchlist 都不是推荐下注。</div>
    </div>`;
  }catch(e){
    root.innerHTML = '<div class="note">WAR_ROOM 数据未就绪。</div>';
  }
}
load();
</script>
</body>
</html>
