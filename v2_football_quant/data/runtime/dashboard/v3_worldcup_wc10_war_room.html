<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>V3 World Cup WC10 War Room</title>
<style>
body{margin:0;background:#0b1220;color:#e6edf7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:960px;margin:0 auto;padding:12px}
.card{background:#121c31;border:1px solid #2a3b5e;border-radius:12px;padding:10px;margin-bottom:10px}
.title{font-weight:900;font-size:20px}
.sub{font-size:12px;color:#9fb2d3;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:#0e1729;border:1px solid #243754;border-radius:10px;padding:8px}
.mini span{display:block;font-size:10px;color:#8ea4c7}
.mini b{display:block;font-size:14px;margin-top:3px}
.note{font-size:12px;line-height:1.5;color:#cad8ec}
.warn{color:#ffd166}
.list .mini{margin-bottom:7px}
@media (max-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="title">V3 World Cup T-10 War Room</div>
    <div class="sub">Observation-only, not betting recommendation</div>
  </div>
  <div id="root" class="card">Loading...</div>
</div>
<script>
function n(v,d){return v===undefined||v===null||v===''?d:v}
function a(v){return Array.isArray(v)?v:[]}
function item(x){return `<div class="mini"><span>${n(x.team,'UNKNOWN')} · ${n(x.signal_type,'WATCHLIST_ONLY')}</span><b>${n(x.confidence,'LOW')} · ${n(x.action_hint,'WATCHLIST_ONLY')}</b><span>${n(x.reason,'')}</span></div>`}
async function load(){
  const root=document.getElementById('root');
  try{
    const resp=await fetch('/data/v3_worldcup/war_room/v3_worldcup_wc10_war_room_20260602.json?ts='+Date.now());
    const m=await resp.json();
    const warn=a(m.warn_only_items);
    const supp=m.supplement_coverage_by_category||{};
    const suppRows=Object.keys(supp).map(k=>`<div class="mini"><span>${k}</span><b>${n((supp[k]||{}).coverage_status,'MISSING')}</b></div>`).join('');
    const fsMissing=a(m.final_squad_missing_team_list);
    const under=a(m.undervalued_candidates), over=a(m.overhyped_risk_candidates);
    root.innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="mini"><span>phase</span><b>${n(m.phase,'V3-WC10')}</b></div>
        <div class="mini"><span>T_minus_days</span><b>${n(m.T_minus_days,10)}</b></div>
        <div class="mini"><span>status</span><b>${n(m.status,'WARN_ONLY')}</b></div>
        <div class="mini"><span>teams</span><b>${n(m.teams_with_roster,0)} / ${n(m.teams_total,0)}</b></div>
        <div class="mini"><span>players_total</span><b>${n(m.players_total,0)}</b></div>
        <div class="mini"><span>warn_only</span><b>${warn.length}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="note">数据覆盖：roster=${n(m.roster_coverage_status,'MISSING')} / caps-goals-minutes=${n(m.caps_goals_minutes_coverage_status,'MISSING')} / injury=${n(m.injury_coverage_status,'MISSING')} / friendly=${n(m.friendly_form_coverage_status,'MISSING')} / market=${n(m.market_baseline_coverage_status,'MISSING')}</div>
      <div class="note warn">WARN_ONLY: ${warn.join('、')}</div>
      <div class="note">supplement layer: ${n(m.supplement_coverage_status,'DATA_MISSING')}（TEMPLATE_ONLY / MISSING 时不得下结论）</div>
      <div class="grid">${suppRows||'<div class="note">supplement coverage data missing</div>'}</div>
    </div>
    <div class="card">
      <div class="note">final squad layer: ${n(m.final_squad_status,'DATA_MISSING')} / coverage=${n(m.final_squad_coverage_status,'DATA_MISSING')}</div>
      <div class="grid">
        <div class="mini"><span>teams_expected</span><b>${n(m.teams_expected_final_squad,48)}</b></div>
        <div class="mini"><span>teams_detected_baseline</span><b>${n(m.teams_detected_in_baseline,46)}</b></div>
        <div class="mini"><span>players_total_baseline</span><b>${n(m.players_total_baseline,1375)}</b></div>
        <div class="mini"><span>final_squad_files_found</span><b>${n(m.final_squad_files_found_count,0)}</b></div>
        <div class="mini"><span>final_26_complete_teams</span><b>${n(m.final_26_complete_teams_count,0)}</b></div>
        <div class="mini"><span>missing_team_count</span><b>${n(m.final_squad_missing_team_count,0)}</b></div>
      </div>
      <div class="note">missing team list (sample): ${fsMissing.length?fsMissing.join('、'):'N/A'}</div>
      <div class="note warn">当前 1375 为 baseline pool，不是最终 26 人名单。当前系统尚未确认 48 队最终名单。</div>
    </div>
    <div class="card">
      <div class="note">source authorization gate: ${n(m.source_authorization_gate_status,'DATA_MISSING')}</div>
      <div class="grid">
        <div class="mini"><span>approved sources</span><b>${n(m.source_authorization_approved_sources_count,0)}</b></div>
        <div class="mini"><span>intake files found</span><b>${n(m.source_authorization_intake_files_found,0)}</b></div>
        <div class="mini"><span>unauthorized files</span><b>${n(m.source_authorization_unauthorized_files_found,0)}</b></div>
        <div class="mini"><span>authorized files</span><b>${n(m.source_authorization_authorized_files_found,0)}</b></div>
        <div class="mini"><span>ready for WC6 ingestion</span><b>${n(m.source_authorization_ready_for_ingestion,0)}</b></div>
      </div>
      <div class="note warn">未授权文件不得 ingest。当前没有 approved real final squad source。WC6 ingestion not started。</div>
    </div>
    <div class="card list">
      <div class="note">Perception Gap Watchlist（每类最多显示 5 条）</div>
      <div class="note">undervalued candidates</div>
      ${(under.slice(0,5).map(item).join('')||'<div class="note">暂无</div>')}
      ${under.length>5?`<div class="note">+${under.length-5} more</div>`:''}
      <div class="note">overhyped risk candidates</div>
      ${(over.slice(0,5).map(item).join('')||'<div class="note">暂无</div>')}
      ${over.length>5?`<div class="note">+${over.length-5} more</div>`:''}
    </div>
    <div class="card">
      <div class="note">开幕战关注：${n((m.opening_match_watch||{}).status,'WATCH_ONLY_PLACEHOLDER')} · ${(m.opening_match_watch||{}).note||''}</div>
      <div class="note">V3 仅为世界杯情报观察层；不输出投注建议；不影响 V4 official grade；缺少 supplement 时不下结论；任何 watchlist 都不是推荐下注。</div>
    </div>`;
  }catch(e){
    root.innerHTML = '<div class="note">WAR_ROOM 数据未就绪。</div>';
  }
}
load();
</script>
</body>
</html>
